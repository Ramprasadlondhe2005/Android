name: e_store
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

#----------------------PACKAGES-------------------#
dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  http: ^1.1.0
  intl: ^0.18.1
  logger: ^2.0.1
  url_launcher: ^6.1.12
  flutter_native_splash: ^2.3.2
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.2

  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Native Splash
  flutter_native_splash: ^2.3.5

flutter:
  uses-material-design: true

  #--------------LOCAL ASSETS------------#
  assets:
    - assets/logos/
    - assets/icons/brands/
    - assets/images/on_boarding_images/
    - assets/images/animations/
    - assets/icons/categories/
    - assets/images/banners/
    - assets/images/products/

  #-------------------LOCAL FONTS-------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/coolvetica_regular.otf
          weight: 300
        - asset: assets/fonts/coolvetica_regular_italic.otf
          weight: 300
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Mediumitalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800

#------------------- SPLASH SCREEN CONFIG -------------------#
#flutter_native_splash:
  #color: "#ffffff"
  #image: assets/logos/splash.png   # make sure this image exists
  #android: true
  #ios: true
  #web: false
